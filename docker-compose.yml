version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      POSTGRES_URL: "postgresql://postgres:postgres@postgres:5432/postgres"
      MONGO_URL: "mongodb://mongo:27017/"
    depends_on:
      - postgres
      - mongo
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mongo:
    image: mongo:5
    volumes:
      - mongo_data:/data/db
  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
volumes:
  postgres_data:
  mongo_data:
